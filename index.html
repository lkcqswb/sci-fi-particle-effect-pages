<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Sakura - Umbral Structure</title>
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #050005; overflow: hidden; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        .ui-overlay {
            position: absolute; top: 20px; left: 20px; color: rgba(255, 182, 193, 0.8);
            pointer-events: none; text-transform: uppercase; letter-spacing: 2px; font-size: 11px;
            border-left: 2px solid #ff69b4; padding-left: 10px; background: rgba(0,0,0,0.4);
        }
        .poem-overlay {
            position: absolute; bottom: 40px; right: 40px;
            color: rgba(255, 182, 193, 0.45);
            font-size: 13px; text-align: right;
            line-height: 2.2; letter-spacing: 4px;
            writing-mode: vertical-rl;
            text-shadow: 0 0 8px rgba(255, 105, 180, 0.15);
            pointer-events: none;
            font-family: "Sawarabi Mincho", serif;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="ui-overlay">
        System: Multi-Layer Umbral Engine v6.0<br>
        Mode: Layered Canopy Optimization<br>
        Structure: Bio-Digital Recursive (Umbrella)
    </div>
    <div class="poem-overlay">
        桜の花が夜空に舞う<br>
        闇の中で輝く光の樹
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        const COLORS = {
            trunk: new THREE.Color(0xffffff), // Darker, more organic trunk
            branch: new THREE.Color(0xeeeeee),
            bloomDeep: new THREE.Color(0xff1493), // Deep Pink
            bloomMid: new THREE.Color(0xff69b4),  // Hot Pink
            bloomLight: new THREE.Color(0xffb6c1), // Light Pink
            bloomWhite: new THREE.Color(0xffffff)  // White/Buds
        };

        const vertexShader = `
            attribute float size;
            attribute vec3 customColor;
            attribute float opacity;
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                vColor = customColor;
                vOpacity = opacity;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (350.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                float dist = length(gl_PointCoord - vec2(0.5));
                if (dist > 0.5) discard;
                // Soft edge for blossoms
                float alpha = (0.5 - dist) * 2.0 * vOpacity;
                gl_FragColor = vec4(vColor, alpha);
            }
        `;

        let scene, camera, renderer, composer, clock, controls;
        let treePoints, petalPoints;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050005);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 4000);
            camera.position.set(0, 500, 1200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 350, 0);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.3;

            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.15);
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(bloomPass);

            clock = new THREE.Clock();

            generateTree();
            generateFallingPetals();
            window.addEventListener('resize', onWindowResize);
        }

        function generateTree() {
            const positions = [], colors = [], sizes = [], opacities = [];
            const tempColor = new THREE.Color();

            // --- 1. Branch & Blossom Generation Logic ---
            function createBranch(start, dir, length, radius, depth) {
                const actualLength = length * (0.8 + Math.random() * 0.4);
                const end = start.clone().add(dir.clone().multiplyScalar(actualLength));
                
                // Draw Branch Particles
                const segmentCount = Math.max(3, Math.floor(actualLength / 5));
                for (let i = 0; i <= segmentCount; i++) {
                    const t = i / segmentCount;
                    const p = start.clone().lerp(end, t);
                    const currentRad = radius * (1 - t * 0.5);
                    
                    // Organic jitter for branch path
                    const jitter = currentRad * 0.3;
                    p.x += (Math.random() - 0.5) * jitter;
                    p.y += (Math.random() - 0.5) * jitter;
                    p.z += (Math.random() - 0.5) * jitter;

                    positions.push(p.x, p.y, p.z);
                    tempColor.copy(COLORS.branch).lerp(COLORS.trunk, depth/6);
                    colors.push(tempColor.r, tempColor.g, tempColor.b);
                    sizes.push(currentRad * 2.5);
                    opacities.push(0.8);
                }

                // Lush Blossom Clusters
                if (depth < 5) {
                    // Reduced density for inner branches (high depth), full density for tips (low depth)
                    const densityMultiplier = depth > 2 ? 30 : 60;
                    const bloomDensity = (6 - depth) * densityMultiplier; 
                    const clusterSpread = (6 - depth) * 12;

                    for (let i = 0; i < bloomDensity; i++) {
                        // Create "clumped" distribution using spherical random
                        const phi = Math.random() * Math.PI * 2;
                        const theta = Math.acos(Math.random() * 2 - 1);
                        const r = Math.pow(Math.random(), 0.7) * clusterSpread;
                        
                        const bp = end.clone();
                        bp.x += r * Math.sin(theta) * Math.cos(phi);
                        bp.y += r * Math.sin(theta) * Math.sin(phi);
                        bp.z += r * Math.cos(theta);

                        // Also add some blooms along the branch length
                        const lerpT = Math.random();
                        const branchP = start.clone().lerp(end, lerpT);
                        const offset = new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)).multiplyScalar(clusterSpread * 0.6);
                        const finalP = bp.lerp(branchP.add(offset), 0.3);

                        positions.push(finalP.x, finalP.y, finalP.z);
                        
                        // Mix colors: White -> Light Pink -> Mid -> Deep
                        const rand = Math.random();
                        if (rand > 0.8) tempColor.copy(COLORS.bloomWhite);
                        else if (rand > 0.4) tempColor.copy(COLORS.bloomLight);
                        else if (rand > 0.15) tempColor.copy(COLORS.bloomMid);
                        else tempColor.copy(COLORS.bloomDeep);
                        
                        colors.push(tempColor.r, tempColor.g, tempColor.b);
                        sizes.push(2.0 + Math.random() * 6.0);
                        
                        let clusterOpacity = 0.4 + Math.random() * 0.5;
                        if (depth > 2) clusterOpacity *= 0.5;
                        opacities.push(clusterOpacity);
                    }
                }

                if (depth <= 0) return;

                // Recursive branching
                const numSubBranches = depth > 3 ? 2 : (Math.random() > 0.4 ? 2 : 1);
                for (let i = 0; i < numSubBranches; i++) {
                    const nextDir = dir.clone();
                    const angleY = Math.random() * Math.PI * 2;
                    const axis = new THREE.Vector3(Math.cos(angleY), 0, Math.sin(angleY)).normalize();
                    const spread = 0.4 + Math.random() * 0.4;
                    nextDir.applyAxisAngle(axis, spread);
                    
                    createBranch(end, nextDir, actualLength * 0.75, radius * 0.65, depth - 1);
                }
            }

            // --- 2. Enhanced Trunk Generation ---
            const trunkHeight = 560;
            const trunkBaseRadius = 45;
            const trunkTopRadius = 8; // Much thinner at the top
            const trunkSegments = 250;
            
            const trunkPath = [];
            for (let i = 0; i < trunkSegments; i++) {
                const t = i / trunkSegments;
                const y = t * trunkHeight;
                // Add organic sway to the trunk
                const offsetX = Math.sin(t * 4) * 15 * t;
                const offsetZ = Math.cos(t * 3) * 12 * t;
                const p = new THREE.Vector3(offsetX, y, offsetZ);
                trunkPath.push({p, t});

                const r = THREE.MathUtils.lerp(trunkBaseRadius, trunkTopRadius, Math.pow(t, 1.2));
                
                // Trunk shell
                const shellDensity = 20;
                for (let j = 0; j < shellDensity; j++) {
                    const angle = (j / shellDensity) * Math.PI * 2;
                    const dist = r * (0.85 + Math.random() * 0.3);
                    const px = p.x + Math.cos(angle) * dist;
                    const pz = p.z + Math.sin(angle) * dist;
                    const py = p.y + (Math.random() - 0.5) * 2;
                    
                    positions.push(px, py, pz);
                    tempColor.copy(COLORS.trunk).lerp(COLORS.branch, t);
                    colors.push(tempColor.r, tempColor.g, tempColor.b);
                    sizes.push(5.0 + Math.random() * 8.0);
                    opacities.push(0.9);
                }

                // Volume fill
                if (i % 2 === 0) {
                    for (let j = 0; j < 8; j++) {
                        const dist = Math.random() * r;
                        const angle = Math.random() * Math.PI * 2;
                        positions.push(p.x + Math.cos(angle) * dist, p.y, p.z + Math.sin(angle) * dist);
                        colors.push(COLORS.trunk.r, COLORS.trunk.g, COLORS.trunk.b);
                        sizes.push(4.0 + Math.random() * 4.0);
                        opacities.push(0.7);
                    }
                }
            }

            // --- 3. Optimized Branching Strategy ---
            // Start main branches before the very top to avoid explosion
            const layers = [
                { h: 0.52, lenMult: 0.08, angleDeg: 100, count: [8, 10], depth: 3 }, // Moved up, short
                { h: 0.62, lenMult: 0.14, angleDeg: 90, count: [8, 10], depth: 4 },  // Moved up, short-mid
                { h: 0.55, lenMult: 0.275, angleDeg: 75, count: [10, 12], depth: 5 },
                { h: 0.70, lenMult: 0.2125, angleDeg: 60, count: [10, 12], depth: 5 },
                { h: 0.82, lenMult: 0.15, angleDeg: 45, count: [8, 10], depth: 4 },
                { h: 0.92, lenMult: 0.0875, angleDeg: 30, count: [8, 8], depth: 4 },
                { h: 0.98, lenMult: 0.0375, angleDeg: 15, count: [6, 6], depth: 3 }
            ];

            const degToRad = Math.PI / 180;
            layers.forEach(layer => {
                const branchCount = Math.floor(layer.count[0] + Math.random() * (layer.count[1] - layer.count[0] + 1));
                const trunkIdx = Math.floor(layer.h * (trunkSegments - 1));
                const {p: startPos} = trunkPath[trunkIdx];
                
                for(let i=0; i<branchCount; i++) {
                    const angleY = (i / branchCount) * Math.PI * 2 + Math.random() * 0.5;
                    const axis = new THREE.Vector3(Math.cos(angleY), 0, Math.sin(angleY)).normalize();
                    const angleFromUp = layer.angleDeg * degToRad + (Math.random() - 0.5) * 0.2;
                    
                    const dir = new THREE.Vector3(0, 1, 0).applyAxisAngle(axis, angleFromUp);
                    createBranch(startPos, dir, trunkHeight * layer.lenMult, 15 * layer.lenMult + 2, layer.depth);
                }
            });

            // Finalize Geometry
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.Float32BufferAttribute(opacities, 1));

            const material = new THREE.ShaderMaterial({
                vertexShader, fragmentShader, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            treePoints = new THREE.Points(geometry, material);
            scene.add(treePoints);
        }


        function generateFallingPetals() {
            const count = 7000; // Increased count
            const pos = [], col = [], size = [], opac = [], vel = [];
            for (let i = 0; i < count; i++) {
                pos.push((Math.random() - 0.5) * 1800, Math.random() * 1200, (Math.random() - 0.5) * 1800);
                
                const rand = Math.random();
                const c = rand > 0.7 ? COLORS.bloomLight : (rand > 0.3 ? COLORS.bloomMid : COLORS.bloomDeep);
                
                col.push(c.r, c.g, c.b);
                size.push(3 + Math.random() * 4);
                opac.push(0.4 + Math.random() * 0.4);
                vel.push((Math.random() - 0.5) * 1.5, -0.8 - Math.random() * 2.0, (Math.random() - 0.5) * 1.5);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('customColor', new THREE.Float32BufferAttribute(col, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(size, 1));
            geo.setAttribute('opacity', new THREE.Float32BufferAttribute(opac, 1));
            geo.userData = { velocities: vel };
            petalPoints = new THREE.Points(geo, new THREE.ShaderMaterial({
                vertexShader, fragmentShader, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            scene.add(petalPoints);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            controls.update();

            if (petalPoints) {
                const positions = petalPoints.geometry.attributes.position.array;
                const v = petalPoints.geometry.userData.velocities;
                for (let i = 0; i < positions.length / 3; i++) {
                    positions[i * 3] += v[i * 3] + Math.sin(elapsed * 0.5 + i) * 0.2;
                    positions[i * 3 + 1] += v[i * 3 + 1];
                    positions[i * 3 + 2] += v[i * 3 + 2] + Math.cos(elapsed * 0.5 + i) * 0.2;
                    if (positions[i * 3 + 1] < 0) positions[i * 3 + 1] = 1000;
                }
                petalPoints.geometry.attributes.position.needsUpdate = true;
            }

            composer.render();
        }
    </script>
</body>
</html>
