<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Sakura - Eternal Bloom</title>
    <style>
        body {
            margin: 0;
            background-color: #050005;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 105, 180, 0.8);
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="ui-overlay">
        System: Sakura Particle Engine v2.0<br>
        Status: Hyper-Bloom Active<br>
        Particles: ~350,000
    </div>

    <!-- Import Three.js and components via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // --- Configuration ---
        const CANOPY_PARTICLES = 400000;
        const PETAL_PARTICLES = 8000;
        const TRUNK_PARTICLES = 150000;
        
        const COLORS = {
            hotPink: new THREE.Color(0xff69b4),
            softPink: new THREE.Color(0xffb6c1),
            gold: new THREE.Color(0xffd700),
            brightGold: new THREE.Color(0xfffacd),
            white: new THREE.Color(0xffffff),
            deepRed: new THREE.Color(0x1a0000)
        };

        // --- Shaders ---
        const particleVertexShader = `
            attribute float size;
            attribute vec3 customColor;
            attribute float opacity;
            varying vec3 vColor;
            varying float vOpacity;
            
            void main() {
                vColor = customColor;
                vOpacity = opacity;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (350.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const particleFragmentShader = `
            varying vec3 vColor;
            varying float vOpacity;
            
            void main() {
                float dist = distance(gl_PointCoord, vec2(0.5, 0.5));
                if (dist > 0.5) discard;
                
                // Softer gaussian-like falloff for "cotton candy" look
                float strength = 1.0 - (dist * 2.0);
                strength = pow(strength, 2.5);
                
                gl_FragColor = vec4(vColor, vOpacity * strength);
            }
        `;

        // --- Initialization ---
        let scene, camera, renderer, composer, controls;
        let canopyPoints, petalPoints, trunkPoints;
        const clock = new THREE.Clock();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0000);
            scene.fog = new THREE.FogExp2(0x0a0000, 0.0015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 200, 600);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.3;
            controls.maxDistance = 1200;
            controls.minDistance = 150;
            controls.target.set(0, 200, 0);

            // --- Post Processing (Bloom) ---
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight), 
                3.5, // High strength for sacred glow
                0.5, // radius
                0.05 // low threshold to bloom more
            );
            
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // Create geometry holders
            createTree();
            createPetals();

            // --- Bottom Light & Energy Source ---
            const mainLight = new THREE.PointLight(0xffcc00, 15, 600);
            mainLight.position.set(0, 0, 0);
            scene.add(mainLight);

            // Intense ground glow
            const groundGlowGeo = new THREE.CircleGeometry(200, 64);
            const groundGlowMat = new THREE.MeshBasicMaterial({
                color: 0xffaa00,
                transparent: true,
                opacity: 0.4,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const groundGlow = new THREE.Mesh(groundGlowGeo, groundGlowMat);
            groundGlow.rotation.x = -Math.PI / 2;
            groundGlow.position.y = -45;
            scene.add(groundGlow);

            // Core pillar of light
            const pillarGeo = new THREE.CylinderGeometry(5, 40, 150, 32, 1, true);
            const pillarMat = new THREE.MeshBasicMaterial({
                color: 0xffcc00,
                transparent: true,
                opacity: 0.1,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.y = 20;
            scene.add(pillar);

            window.addEventListener('resize', onWindowResize);
        }

        function createTree() {
            // Arrays for Trunk
            const tPos = [];
            const tCol = [];
            const tSize = [];
            const tOpac = [];

            // Arrays for Canopy
            const cPos = [];
            const cCol = [];
            const cSize = [];
            const cOpac = [];

            const tempColor = new THREE.Color();

            function addParticlesAlongBranch(start, end, startRad, endRad, isTip) {
                const diff = new THREE.Vector3().subVectors(end, start);
                const len = diff.length();
                const iterations = Math.max(10, Math.floor(len * (isTip ? 80 : 50)));
                
                const norm = diff.clone().normalize();
                const pVec = Math.abs(norm.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
                const tangent = new THREE.Vector3().crossVectors(norm, pVec).normalize();
                const bitangent = new THREE.Vector3().crossVectors(norm, tangent).normalize();

                for (let i = 0; i < iterations; i++) {
                    const t = Math.random();
                    const r = Math.sqrt(Math.random()) * (startRad + (endRad - startRad) * t);
                    const angle = Math.random() * Math.PI * 2;
                    
                    const p = new THREE.Vector3()
                        .copy(start)
                        .addScaledVector(diff, t)
                        .addScaledVector(tangent, Math.cos(angle) * r)
                        .addScaledVector(bitangent, Math.sin(angle) * r);

                    tPos.push(p.x, p.y, p.z);

                    // Gradient: Gold at bottom (-50) to Pink at top (~400)
                    const heightFactor = THREE.MathUtils.clamp((p.y + 50) / 400, 0, 1);
                    
                    if (heightFactor < 0.3) {
                        tempColor.copy(COLORS.brightGold).lerp(COLORS.gold, heightFactor / 0.3);
                    } else if (heightFactor < 0.6) {
                        tempColor.copy(COLORS.gold).lerp(COLORS.hotPink, (heightFactor - 0.3) / 0.3);
                    } else {
                        tempColor.copy(COLORS.hotPink).lerp(COLORS.softPink, (heightFactor - 0.6) / 0.4);
                    }

                    tCol.push(tempColor.r, tempColor.g, tempColor.b);
                    tSize.push(isTip ? (1.5 + Math.random() * 2) : (2.0 + Math.random() * 4));
                    tOpac.push(0.6 + Math.random() * 0.4);

                    // Add canopy particles at tips or randomly along upper branches
                    if (isTip || (heightFactor > 0.4 && Math.random() > 0.8)) {
                        const cloudCount = isTip ? 15 : 2;
                        for(let j=0; j<cloudCount; j++) {
                            const offset = new THREE.Vector3(
                                (Math.random() - 0.5) * 50,
                                (Math.random() - 0.5) * 40,
                                (Math.random() - 0.5) * 50
                            );
                            const cp = p.clone().add(offset);
                            cPos.push(cp.x, cp.y, cp.z);
                            
                            // Canopy is mostly soft pink
                            const cRand = Math.random();
                            if (cRand > 0.8) tempColor.copy(COLORS.white);
                            else if (cRand > 0.4) tempColor.copy(COLORS.softPink);
                            else tempColor.copy(COLORS.hotPink);

                            cCol.push(tempColor.r, tempColor.g, tempColor.b);
                            cSize.push(2.0 + Math.random() * 6.0);
                            cOpac.push(0.1 + Math.random() * 0.4);
                        }
                    }
                }
            }

            // Recursive Fractal Growth
            function grow(start, dir, length, radius, depth) {
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, length);
                const isTip = depth <= 1;
                
                addParticlesAlongBranch(start, end, radius, radius * 0.6, isTip);

                if (depth <= 0) return;

                // Branching
                const branches = depth > 4 ? 1 : (depth > 2 ? 3 : 2); 
                
                for (let i = 0; i < branches; i++) {
                    const newDir = dir.clone();
                    
                    if (depth > 4) {
                        // Main trunk stays straight
                        newDir.y += (Math.random() - 0.5) * 0.1;
                    } else {
                        // Spread out
                        const spread = (6 - depth) * 0.3;
                        newDir.x += (Math.random() - 0.5) * spread;
                        newDir.y += (Math.random() * 0.2); // keep growing up
                        newDir.z += (Math.random() - 0.5) * spread;
                    }
                    newDir.normalize();

                    grow(
                        end,
                        newDir,
                        length * (0.75 + Math.random() * 0.15),
                        radius * 0.6,
                        depth - 1
                    );
                }
            }

            // Start growth
            grow(new THREE.Vector3(0, -50, 0), new THREE.Vector3(0, 1, 0), 160, 25, 6);

            // Trunk Points
            const tGeometry = new THREE.BufferGeometry();
            tGeometry.setAttribute('position', new THREE.Float32BufferAttribute(tPos, 3));
            tGeometry.setAttribute('customColor', new THREE.Float32BufferAttribute(tCol, 3));
            tGeometry.setAttribute('size', new THREE.Float32BufferAttribute(tSize, 1));
            tGeometry.setAttribute('opacity', new THREE.Float32BufferAttribute(tOpac, 1));

            const tMaterial = new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthTest: true
            });
            trunkPoints = new THREE.Points(tGeometry, tMaterial);
            scene.add(trunkPoints);

            // Canopy Points
            const cGeometry = new THREE.BufferGeometry();
            cGeometry.setAttribute('position', new THREE.Float32BufferAttribute(cPos, 3));
            cGeometry.setAttribute('customColor', new THREE.Float32BufferAttribute(cCol, 3));
            cGeometry.setAttribute('size', new THREE.Float32BufferAttribute(cSize, 1));
            cGeometry.setAttribute('opacity', new THREE.Float32BufferAttribute(cOpac, 1));

            const cMaterial = new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false
            });
            canopyPoints = new THREE.Points(cGeometry, cMaterial);
            scene.add(canopyPoints);
        }

        function createPetals() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PETAL_PARTICLES * 3);
            const colors = new Float32Array(PETAL_PARTICLES * 3);
            const sizes = new Float32Array(PETAL_PARTICLES);
            const opacities = new Float32Array(PETAL_PARTICLES);
            const velocities = new Float32Array(PETAL_PARTICLES * 3);

            for (let i = 0; i < PETAL_PARTICLES; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 800;
                positions[i * 3 + 1] = Math.random() * 600;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 800;

                const color = Math.random() > 0.3 ? COLORS.softPink : COLORS.gold;
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                sizes[i] = 3.0 + Math.random() * 5.0;
                opacities[i] = 0.4 + Math.random() * 0.6;

                velocities[i * 3] = (Math.random() - 0.5) * 0.8;
                velocities[i * 3 + 1] = -0.4 - Math.random() * 0.8;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.8;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
            geometry.userData.velocities = velocities;

            const material = new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false
            });

            petalPoints = new THREE.Points(geometry, material);
            scene.add(petalPoints);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            controls.update();

            // Sway canopy and trunk slightly
            if (canopyPoints) {
                canopyPoints.rotation.y = Math.sin(elapsed * 0.2) * 0.05;
                canopyPoints.position.x = Math.sin(elapsed * 0.5) * 2;
            }
            if (trunkPoints) {
                trunkPoints.rotation.y = Math.sin(elapsed * 0.2) * 0.05;
            }

            // Animate Petals
            if (petalPoints) {
                const pos = petalPoints.geometry.attributes.position.array;
                const vel = petalPoints.geometry.userData.velocities;
                for (let i = 0; i < PETAL_PARTICLES; i++) {
                    const idx = i * 3;
                    pos[idx] += vel[idx] + Math.sin(elapsed * 0.5 + i) * 0.1;
                    pos[idx + 1] += vel[idx + 1];
                    pos[idx + 2] += vel[idx + 2] + Math.cos(elapsed * 0.5 + i) * 0.1;

                    if (pos[idx + 1] < -50) {
                        pos[idx] = (Math.random() - 0.5) * 800;
                        pos[idx + 1] = 500 + Math.random() * 100;
                        pos[idx + 2] = (Math.random() - 0.5) * 800;
                    }
                }
                petalPoints.geometry.attributes.position.needsUpdate = true;
            }

            composer.render();
        }
    </script>
</body>
</html>
