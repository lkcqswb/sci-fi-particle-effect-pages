<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial Sakura - Particle Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W, H;

  function resize() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const branches = [];
  const particles = [];
  const branchEndpoints = [];
  
  // 树配置
  const treeConfig = {
    startX: 0,
    startY: 0,
    maxDepth: 10,
    trunkWidth: 12,
    trunkLength: 0,
    branchColor: 'rgba(230, 230, 220, 0.7)', // 灰白色带淡金
    particleCount: 2200
  };

  class Branch {
    constructor(x1, y1, angle, length, depth, width) {
      this.x1 = x1;
      this.y1 = y1;
      this.angle = angle;
      this.length = length;
      this.depth = depth;
      this.width = width;
      
      // 生成曲折路径
      this.segments = [];
      let cx = x1;
      let cy = y1;
      const segmentCount = 4 + Math.floor(Math.random() * 4);
      const segLen = length / segmentCount;
      
      for (let i = 0; i < segmentCount; i++) {
        const nextAngle = angle + (Math.random() - 0.5) * 0.4;
        const nx = cx + Math.cos(nextAngle) * segLen;
        const ny = cy + Math.sin(nextAngle) * segLen;
        this.segments.push({ x1: cx, y1: cy, x2: nx, y2: ny });
        cx = nx;
        cy = ny;
      }
      this.x2 = cx;
      this.y2 = cy;

      if (depth === treeConfig.maxDepth || (depth > 5 && Math.random() < 0.1)) {
        branchEndpoints.push({ x: this.x2, y: this.y2, depth: this.depth });
      }
    }

    draw() {
      ctx.strokeStyle = treeConfig.branchColor;
      ctx.lineWidth = this.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      this.segments.forEach(seg => {
        ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
      });
      ctx.stroke();
    }
  }

  function createTree(x, y, angle, length, depth, width) {
    const branch = new Branch(x, y, angle, length, depth, width);
    branches.push(branch);

    if (depth < treeConfig.maxDepth) {
      const numBranches = (depth < 2) ? 2 : (Math.random() < 0.8 ? 2 : 3);
      for (let i = 0; i < numBranches; i++) {
        const newAngle = angle + (Math.random() - 0.5) * 0.9;
        const newLength = length * (0.7 + Math.random() * 0.2);
        const newWidth = width * 0.65;
        createTree(branch.x2, branch.y2, newAngle, newLength, depth + 1, newWidth);
      }
    }
  }

  class Particle {
    constructor() {
      this.init();
    }

    init() {
      // 粒子主要分布在树枝末端
      const ep = branchEndpoints[Math.floor(Math.random() * branchEndpoints.length)];
      // 越靠近外围（depth越大），粒子分布范围越广，形成光晕
      const spread = (ep.depth / treeConfig.maxDepth) * 60 + 20;
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.pow(Math.random(), 0.5) * spread;
      
      this.baseX = ep.x + Math.cos(angle) * dist;
      this.baseY = ep.y + Math.sin(angle) * dist;
      this.x = this.baseX;
      this.y = this.baseY;
      
      this.size = Math.random() * 1.5 + 0.5;
      this.alpha = Math.random() * 0.6 + 0.2;
      
      // 色彩：亮白为主，冰蓝和淡紫
      const r = Math.random();
      if (r < 0.7) {
        this.color = `rgba(255, 255, 255, ${this.alpha})`; // 纯白
      } else if (r < 0.85) {
        this.color = `rgba(200, 230, 255, ${this.alpha})`; // 冰蓝
      } else {
        this.color = `rgba(230, 200, 255, ${this.alpha})`; // 淡紫
      }
      
      this.vx = (Math.random() - 0.5) * 0.2;
      this.vy = (Math.random() - 0.5) * 0.2;
      this.phi = Math.random() * Math.PI * 2;
    }

    update(t) {
      this.x = this.baseX + Math.sin(t + this.phi) * 3;
      this.y = this.baseY + Math.cos(t * 1.2 + this.phi) * 3;
    }

    draw() {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      
      // 增加微弱光晕效果
      if (this.size > 1.2) {
        ctx.shadowBlur = 4;
        ctx.shadowColor = this.color;
      } else {
        ctx.shadowBlur = 0;
      }
    }
  }

  function init() {
    branches.length = 0;
    particles.length = 0;
    branchEndpoints.length = 0;
    
    // 从底部中央生长
    const trunkLen = H * 0.22;
    createTree(W / 2, H * 0.9, -Math.PI / 2, trunkLen, 0, treeConfig.trunkWidth);
    
    for (let i = 0; i < treeConfig.particleCount; i++) {
      particles.push(new Particle());
    }
  }

  function drawBottomLight() {
    const grd = ctx.createRadialGradient(W / 2, H * 0.95, 0, W / 2, H * 0.95, H * 0.4);
    grd.addColorStop(0, 'rgba(255, 250, 220, 0.25)'); // 暖白光
    grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }

  let time = 0;
  function loop() {
    time += 0.01;
    // 纯黑背景
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.shadowBlur = 0;

    drawBottomLight();

    // 绘制树干
    branches.forEach(b => b.draw());

    // 绘制粒子
    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => {
      p.update(time);
      p.draw();
    });
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(loop);
  }

  init();
  loop();

  window.addEventListener('click', () => {
    init();
  });
})();
</script>
</body>
</html>
