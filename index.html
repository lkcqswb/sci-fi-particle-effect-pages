<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Sakura - Umbral Structure</title>
    <style>
        body { margin: 0; background-color: #050005; overflow: hidden; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        .ui-overlay {
            position: absolute; top: 20px; left: 20px; color: rgba(255, 182, 193, 0.8);
            pointer-events: none; text-transform: uppercase; letter-spacing: 2px; font-size: 11px;
            border-left: 2px solid #ff69b4; padding-left: 10px; background: rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="ui-overlay">
        System: Multi-Layer Umbral Engine v6.0<br>
        Mode: Layered Canopy Optimization<br>
        Structure: Bio-Digital Recursive (Umbrella)
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        const COLORS = {
            trunk: new THREE.Color(0x2a0a1a),
            branch: new THREE.Color(0x4a1a35),
            bloom: new THREE.Color(0xff69b4),
            highlight: new THREE.Color(0xffb6c1),
            white: new THREE.Color(0xffffff)
        };

        const vertexShader = `
            attribute float size;
            attribute vec3 customColor;
            attribute float opacity;
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                vColor = customColor;
                vOpacity = opacity;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (300.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard;
                gl_FragColor = vec4(vColor, vOpacity);
            }
        `;

        let scene, camera, renderer, composer, clock, controls;
        let treePoints, petalPoints;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020002);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 4000);
            camera.position.set(0, 400, 1200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 200, 0);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.4;

            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.4, 0.2);
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(bloomPass);

            clock = new THREE.Clock();

            generateTree();
            generateFallingPetals();
            window.addEventListener('resize', onWindowResize);
        }

        function generateTree() {
            const positions = [], colors = [], sizes = [], opacities = [];
            const tempColor = new THREE.Color();

            // --- 1. Branch Generation Logic ---
            function createBranch(start, dir, length, radius, depth) {
                // Apply length randomness (±10%)
                const actualLength = length * (0.9 + Math.random() * 0.2);
                const end = start.clone().add(dir.clone().multiplyScalar(actualLength));
                
                // Draw Branch Particles
                const segmentCount = Math.max(2, Math.floor(actualLength / 6));
                for (let i = 0; i <= segmentCount; i++) {
                    const t = i / segmentCount;
                    const p = start.clone().lerp(end, t);
                    const currentRad = radius * (1 - t * 0.4);
                    
                    // Add slight jitter for organic look
                    p.x += (Math.random() - 0.5) * currentRad * 0.4;
                    p.y += (Math.random() - 0.5) * currentRad * 0.4;
                    p.z += (Math.random() - 0.5) * currentRad * 0.4;

                    positions.push(p.x, p.y, p.z);
                    
                    // Dynamic coloring: trunk -> branch -> bloom
                    if (depth > 2) tempColor.copy(COLORS.trunk).lerp(COLORS.branch, (6-depth)/4);
                    else tempColor.copy(COLORS.branch).lerp(COLORS.bloom, (2-depth)/2);
                    
                    colors.push(tempColor.r, tempColor.g, tempColor.b);
                    sizes.push(currentRad * 2.0);
                    opacities.push(depth > 2 ? 0.9 : 0.7);
                }

                // Add Blossom Clusters on smaller branches
                if (depth < 4) {
                    const bloomCount = Math.floor((4 - depth) * 40);
                    const spread = (4 - depth) * 15;
                    for (let i = 0; i < bloomCount; i++) {
                        const offset = new THREE.Vector3(
                            (Math.random() - 0.5) * spread * 2.5,
                            (Math.random() - 0.5) * spread * 1.5,
                            (Math.random() - 0.5) * spread * 2.5
                        );
                        const bp = end.clone().add(offset);
                        positions.push(bp.x, bp.y, bp.z);
                        
                        const rand = Math.random();
                        if (rand > 0.85) tempColor.copy(COLORS.white);
                        else if (rand > 0.4) tempColor.copy(COLORS.highlight);
                        else tempColor.copy(COLORS.bloom);
                        
                        colors.push(tempColor.r, tempColor.g, tempColor.b);
                        sizes.push(1.5 + Math.random() * 5);
                        opacities.push(0.2 + Math.random() * 0.3);
                    }
                }

                if (depth <= 0) return;

                // Recursive secondary branching
                const numSubBranches = depth > 2 ? 2 : 1;
                for (let i = 0; i < numSubBranches; i++) {
                    const nextDir = dir.clone();
                    // Apply random rotation for sub-branches
                    const angleY = Math.random() * Math.PI * 2;
                    const axis = new THREE.Vector3(Math.cos(angleY), 0, Math.sin(angleY)).normalize();
                    const spread = 0.3 + Math.random() * 0.3;
                    nextDir.applyAxisAngle(axis, spread);
                    
                    createBranch(end, nextDir, actualLength * 0.65, radius * 0.6, depth - 1);
                }
            }

            // --- 2. Trunk Generation ---
            const trunkHeight = 140;
            const trunkRadius = 28;
            for (let i = 0; i < 80; i++) {
                const t = i / 80;
                const p = new THREE.Vector3(0, t * trunkHeight, 0);
                const r = trunkRadius * (1.1 - t * 0.5);
                
                // Add girth
                const density = 4;
                for(let j=0; j<density; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.pow(Math.random(), 0.5) * r;
                    const px = p.x + Math.cos(angle) * dist;
                    const pz = p.z + Math.sin(angle) * dist;
                    positions.push(px, p.y, pz);
                    
                    tempColor.copy(COLORS.trunk).lerp(COLORS.branch, t);
                    colors.push(tempColor.r, tempColor.g, tempColor.b);
                    sizes.push(1.5 + Math.random() * 3.5);
                    opacities.push(0.8 + Math.random() * 0.2);
                }
            }

            // --- 3. Layered Branching Strategy ---
            const layers = [
                { h: 0.65, lenMult: 0.8, angleDeg: 85, count: [8, 10], depth: 5 }, // Bottom
                { h: 0.75, lenMult: 0.6, angleDeg: 70, count: [6, 8],  depth: 4 }, // Lower-mid
                { h: 0.85, lenMult: 0.45, angleDeg: 50, count: [5, 6],  depth: 4 }, // Upper-mid
                { h: 0.92, lenMult: 0.3, angleDeg: 35, count: [5, 6],  depth: 3 }, // Near-top
                { h: 1.0,  lenMult: 0.2, angleDeg: 20, count: [4, 4],  depth: 3 }  // Top
            ];

            const degToRad = Math.PI / 180;

            layers.forEach((layer, layerIdx) => {
                const branchCount = Math.floor(layer.count[0] + Math.random() * (layer.count[1] - layer.count[0] + 1));
                const startHeight = trunkHeight * layer.h;
                
                for(let i=0; i<branchCount; i++) {
                    // Base angle around trunk (evenly distributed with jitter)
                    const angleY = (i / branchCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
                    const axis = new THREE.Vector3(Math.cos(angleY), 0, Math.sin(angleY)).normalize();
                    
                    // Angle from vertical (convert degree to rad + small random offset)
                    const angleFromUp = layer.angleDeg * degToRad + (Math.random() - 0.5) * 0.1;
                    
                    const dir = new THREE.Vector3(0, 1, 0).applyAxisAngle(axis, angleFromUp);
                    const baseLen = trunkHeight * layer.lenMult;
                    const startPos = new THREE.Vector3(0, startHeight, 0);
                    
                    createBranch(startPos, dir, baseLen, 12 * layer.lenMult + 2, layer.depth);
                }
            });

            // Finalize Geometry
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.Float32BufferAttribute(opacities, 1));

            const material = new THREE.ShaderMaterial({
                vertexShader, fragmentShader, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            treePoints = new THREE.Points(geometry, material);
            scene.add(treePoints);
        }


        function generateFallingPetals() {
            const count = 3000;
            const pos = [], col = [], size = [], opac = [], vel = [];
            for (let i = 0; i < count; i++) {
                pos.push((Math.random() - 0.5) * 1500, Math.random() * 1000, (Math.random() - 0.5) * 1500);
                const c = Math.random() > 0.5 ? COLORS.bloom : COLORS.highlight;
                col.push(c.r, c.g, c.b);
                size.push(2 + Math.random() * 3);
                opac.push(0.3 + Math.random() * 0.4);
                vel.push((Math.random() - 0.5) * 1, -0.5 - Math.random() * 1.5, (Math.random() - 0.5) * 1);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('customColor', new THREE.Float32BufferAttribute(col, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(size, 1));
            geo.setAttribute('opacity', new THREE.Float32BufferAttribute(opac, 1));
            geo.userData = { velocities: vel };
            petalPoints = new THREE.Points(geo, new THREE.ShaderMaterial({
                vertexShader, fragmentShader, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            scene.add(petalPoints);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            controls.update();

            if (petalPoints) {
                const positions = petalPoints.geometry.attributes.position.array;
                const v = petalPoints.geometry.userData.velocities;
                for (let i = 0; i < positions.length / 3; i++) {
                    positions[i * 3] += v[i * 3] + Math.sin(elapsed * 0.5 + i) * 0.2;
                    positions[i * 3 + 1] += v[i * 3 + 1];
                    positions[i * 3 + 2] += v[i * 3 + 2] + Math.cos(elapsed * 0.5 + i) * 0.2;
                    if (positions[i * 3 + 1] < 0) positions[i * 3 + 1] = 1000;
                }
                petalPoints.geometry.attributes.position.needsUpdate = true;
            }

            composer.render();
        }
    </script>
</body>
</html>
