<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Fi Celestial Sakura</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
  canvas { display: block; width: 100vw; height: 100vh; filter: contrast(1.1) brightness(1.1); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d', { alpha: false });
  let W, H;

  function resize() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    init();
  }
  
  const branches = [];
  const particles = [];
  const branchEndpoints = [];
  
  const config = {
    maxDepth: 12,
    trunkWidth: 16,
    branchColor: 'rgba(210, 215, 225, 0.4)', // 灰白色
    glowColor: 'rgba(100, 150, 255, 0.1)',
    particleCount: 4500,
    lightningJaggedness: 0.6
  };

  class Branch {
    constructor(x1, y1, angle, length, depth, width) {
      this.x1 = x1;
      this.y1 = y1;
      this.angle = angle;
      this.length = length;
      this.depth = depth;
      this.width = width;
      
      // 生成更细碎、蜿蜒的曲折路径（雷电感）
      this.segments = [];
      let cx = x1;
      let cy = y1;
      // 深度越深，段数越多，越显破碎
      const segmentCount = Math.max(3, Math.floor(8 - depth / 2));
      const segLen = length / segmentCount;
      
      for (let i = 0; i < segmentCount; i++) {
        // 增加随机偏移量模拟曲折
        const offset = (Math.random() - 0.5) * config.lightningJaggedness;
        const nextAngle = angle + offset;
        const nx = cx + Math.cos(nextAngle) * segLen;
        const ny = cy + Math.sin(nextAngle) * segLen;
        this.segments.push({ x1: cx, y1: cy, x2: nx, y2: ny });
        cx = nx;
        cy = ny;
        // 每一段都微调角度，产生连贯的弯曲
        angle += (Math.random() - 0.5) * 0.2;
      }
      this.x2 = cx;
      this.y2 = cy;

      // 记录末梢位置用于生成粒子
      if (depth >= config.maxDepth - 4) {
        branchEndpoints.push({ x: this.x2, y: this.y2, depth: this.depth });
      }
    }

    draw() {
      ctx.strokeStyle = config.branchColor;
      ctx.lineWidth = this.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      this.segments.forEach(seg => {
        ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
      });
      ctx.stroke();

      // 给主要树干增加一层极细的高亮核心，增加质感
      if (this.depth < 4) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = this.width * 0.3;
        ctx.stroke();
      }
    }
  }

  function createTree(x, y, angle, length, depth, width) {
    if (depth > config.maxDepth) return;
    
    const branch = new Branch(x, y, angle, length, depth, width);
    branches.push(branch);

    const numBranches = (depth < 2) ? 2 : (Math.random() < 0.7 ? 2 : 3);
    for (let i = 0; i < numBranches; i++) {
      // 树枝分叉角度随深度变化，末梢更散开
      const angleSpread = 0.4 + (depth / config.maxDepth) * 0.8;
      const newAngle = angle + (Math.random() - 0.5) * angleSpread;
      const newLength = length * (0.75 + Math.random() * 0.15);
      const newWidth = width * 0.65;
      
      // 随机提前终止某些细小分支
      if (depth > 5 && Math.random() < 0.05) continue;
      
      createTree(branch.x2, branch.y2, newAngle, newLength, depth + 1, newWidth);
    }
  }

  class Particle {
    constructor() {
      this.init();
    }

    init() {
      // 随机选择一个树枝末端
      const ep = branchEndpoints[Math.floor(Math.random() * branchEndpoints.length)];
      
      // 粒子分布在末梢周围，形成云团感
      const spread = (ep.depth / config.maxDepth) * 120 + 30;
      const angle = Math.random() * Math.PI * 2;
      // 使用指数分布让中心稍微密集一点，但整体向外围扩散
      const dist = Math.pow(Math.random(), 0.7) * spread;
      
      this.baseX = ep.x + Math.cos(angle) * dist;
      this.baseY = ep.y + Math.sin(angle) * dist;
      this.x = this.baseX;
      this.y = this.baseY;
      this.z = Math.random() * 2 - 1; // 模拟深度感
      
      this.size = Math.random() * 1.8 + 0.2;
      this.alpha = Math.random() * 0.8 + 0.1;
      
      // 色彩配比：亮白(50%), 冰蓝(30%), 淡紫(20%)
      const r = Math.random();
      if (r < 0.5) {
        this.color = { r: 255, g: 255, b: 255 }; // 纯白
      } else if (r < 0.8) {
        this.color = { r: 180, g: 230, b: 255 }; // 冰蓝
      } else {
        this.color = { r: 220, g: 190, b: 255 }; // 淡紫
      }
      
      this.life = Math.random();
      this.speed = 0.002 + Math.random() * 0.005;
      this.offset = Math.random() * 100;
    }

    update(t) {
      // 微小的浮动动画
      const pulse = Math.sin(t * 0.5 + this.offset) * 5;
      this.x = this.baseX + Math.sin(t + this.offset) * 4;
      this.y = this.baseY + Math.cos(t * 0.8 + this.offset) * 4;
      
      // 呼吸灯效果
      this.currentAlpha = this.alpha * (0.6 + Math.sin(t + this.offset) * 0.4);
    }

    draw() {
      const a = this.currentAlpha;
      ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${a})`;
      
      // 绘制粒子
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      
      // 较大的粒子增加光晕，形成 3D 点云的发光感
      if (this.size > 1.3) {
        ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${a * 0.3})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function init() {
    branches.length = 0;
    particles.length = 0;
    branchEndpoints.length = 0;
    
    // 树干参数：从底部中央生长，高度约为屏幕的 1/4
    const trunkLen = H * 0.24;
    createTree(W / 2, H * 0.92, -Math.PI / 2, trunkLen, 0, config.trunkWidth);
    
    for (let i = 0; i < config.particleCount; i++) {
      particles.push(new Particle());
    }
  }

  function drawBottomLight() {
    // 底部向上的暖白光投影
    const grd = ctx.createRadialGradient(W / 2, H, 10, W / 2, H, H * 0.6);
    grd.addColorStop(0, 'rgba(255, 245, 200, 0.18)'); // 暖白色
    grd.addColorStop(0.4, 'rgba(255, 245, 220, 0.05)');
    grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }

  let time = 0;
  function loop() {
    time += 0.015;
    
    // 纯黑背景清理
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // 绘制环境光
    drawBottomLight();

    // 绘制树干（先绘制树干）
    ctx.globalAlpha = 0.8;
    branches.forEach(b => b.draw());
    ctx.globalAlpha = 1.0;

    // 绘制粒子（使用 lighter 混合模式增加发光科幻感）
    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => {
      p.update(time);
      p.draw();
    });
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  loop();

  // 点击刷新
  window.addEventListener('mousedown', () => {
    init();
  });
})();
</script>
</body>
</html>
