<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Sakura - Sci-Fi Particle Effect</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#02040a;overflow:hidden;cursor:none;}
  canvas{display:block;width:100vw;height:100vh;}
  #ui{position:fixed;bottom:20px;left:20px;color:rgba(80,180,255,0.55);font-family:monospace;font-size:11px;letter-spacing:1.5px;pointer-events:none;line-height:1.8;}
  #stats{position:fixed;top:16px;right:20px;color:rgba(80,180,255,0.4);font-family:monospace;font-size:10px;letter-spacing:1px;pointer-events:none;text-align:right;line-height:1.8;}
  #scanlines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.03) 0px,rgba(0,0,0,0.03) 1px,transparent 1px,transparent 2px);z-index:10;}
</style>
</head>
<body>
<div id="ui">SYSTEM.STABLE // CHERRY_CORE_INIT // FLOW_ACTIVE<br><span id="ui-hint">[SPACE] PAUSE &nbsp; [+/-] PARTICLES &nbsp; [G] GRID</span></div>
<div id="stats"><span id="fps">FPS: --</span><br><span id="pcount">PARTICLES: --</span></div>
<div id="scanlines"></div>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════
// CONFIG — 全部可调参数集中于此
// ═══════════════════════════════════════════════════════
var CFG = {
  PARTICLE_COUNT:  4500,
  BG_ALPHA:         0.16,    // 背景残影强度（越小拖尾越长）
  MOUSE_RADIUS:     160,     // 鼠标斥力半径
  MOUSE_BURST_R:    320,     // 点击爆发半径
  BLOOM_LAYERS:     2,       // bloom 层数（降低开销）
  BLOOM_ALPHA:      0.08,    // bloom 基础透明度
  WIND_CHANGE_INT:  0.008,   // 风向随机变化概率
  WIND_LERP:        0.012,   // 风向插值速度
  VEL_DAMPING:      0.94,    // 速度阻尼
  DEPTH_SAMPLE:     12,      // 远景光晕采样间隔（性能开关）
  SHOW_GRID:        false,   // 默认关闭网格
  DPR:              Math.min(window.devicePixelRatio || 1, 2), // 限制最大2x
};

// ═══════════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════════
var cv  = document.getElementById('c');
var cx  = cv.getContext('2d', {alpha: false});
var W, H, dpr;

function resize(){
  dpr = CFG.DPR;
  W   = cv.width  = Math.round(window.innerWidth  * dpr);
  H   = cv.height = Math.round(window.innerHeight * dpr);
  cv.style.width  = window.innerWidth  + 'px';
  cv.style.height = window.innerHeight + 'px';
  // 重建空间网格
  buildSpatialGrid();
  rebuildScene();
}
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
var N        = CFG.PARTICLE_COUNT;
var px=[], py=[], vx=[], vy=[];
var tx=[], ty=[];           // 静止基准坐标
var cr=[], cg=[], cb=[], sz=[], tp=[], ph=[], spd=[]; // speed multiplier per particle
var mouse    = {x: -9000, y: -9000};
var t        = 0;
var windA    = 0, windS = 1.5, twA = 0, twS = 1.5;
var paused   = false;
var showGrid = CFG.SHOW_GRID;
var lastTime = 0, fps = 0, frameCount = 0, fpsAccum = 0;
var spatialGrid = {};       // 空间哈希网格
var GRID_CELL = 80;         // 网格单元格大小

// ═══════════════════════════════════════════════════════
// SPATIAL HASH GRID — 加速鼠标碰撞 O(n) → O(周边格子)
// ═══════════════════════════════════════════════════════
function buildSpatialGrid(){
  spatialGrid = {};
}
function gridKey(gx, gy){ return (gx + 1000) * 10000 + (gy + 1000); }
function insertGrid(i){
  var gx = Math.floor(px[i] / GRID_CELL);
  var gy = Math.floor(py[i] / GRID_CELL);
  var k  = gridKey(gx, gy);
  if(!spatialGrid[k]) spatialGrid[k] = [];
  spatialGrid[k].push(i);
}
function queryRadius(x, y, r){
  var res = [];
  var gx0 = Math.floor((x - r) / GRID_CELL);
  var gx1 = Math.floor((x + r) / GRID_CELL);
  var gy0 = Math.floor((y - r) / GRID_CELL);
  var gy1 = Math.floor((y + r) / GRID_CELL);
  for(var gx = gx0; gx <= gx1; gx++){
    for(var gy = gy0; gy <= gy1; gy++){
      var k = gridKey(gx, gy);
      if(spatialGrid[k]) res = res.concat(spatialGrid[k]);
    }
  }
  return res;
}

// ═══════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════
function rnd(a,b){ return a + Math.random() * (b - a); }
function rndInt(a,b){ return Math.floor(rnd(a, b+1)); }

// Sci-fi 配色盘：深空蓝/霓虹粉/电子紫/青白
var PALETTE = [
  [60,  130, 255],  // 赛博蓝
  [255, 100, 200],  // 霓虹粉
  [150, 180, 255],  // 浅紫蓝
  [200, 240, 255],  // 青白
  [80,  200, 180],  // 翠青
  [255, 200, 100],  // 琥珀金
];

function pickColor(i){
  var c = PALETTE[i % PALETTE.length];
  return {r: c[0], g: c[1], b: c[2]};
}

// ═══════════════════════════════════════════════════════
// PARTICLE INIT
// ═══════════════════════════════════════════════════════
function init(){
  px=[]; py=[]; vx=[]; vy=[]; tx=[]; ty=[];
  cr=[]; cg=[]; cb=[]; sz=[]; tp=[]; ph=[]; spd=[];
  for(var i = 0; i < N; i++){
    px[i]=0; py[i]=0; vx[i]=0; vy[i]=0; tx[i]=0; ty[i]=0;
    cr[i]=255; cg[i]=255; cb[i]=255; sz[i]=2; tp[i]=0; ph[i]=0; spd[i]=1;
  }
}

function rebuildScene(){
  init();
  var idx = 0;
  var waterY = H * 0.68;

  // ── 1. 水面能量地平线 (10%)
  var wN = Math.floor(N * 0.10);
  for(var i = 0; i < wN && idx < N; i++, idx++){
    px[idx] = rnd(0, W); py[idx] = waterY + rnd(0, H - waterY);
    tx[idx] = px[idx];   ty[idx] = py[idx];
    vx[idx] = rnd(-0.15, 0.15); vy[idx] = 0;
    var c = pickColor(0);
    cr[idx]=c.r; cg[idx]=c.g; cb[idx]=c.b;
    sz[idx] = rnd(1.5, 3.5) * dpr; tp[idx]=1; ph[idx]=rnd(0, Math.PI*2); spd[idx]=rnd(0.5,1.5);
  }

  // ── 2. 核心樱花树发光簇 (5个点位 × 12%)
  var treeSpots = [
    {x: W*0.10, y: H*0.38, r: H*0.24},
    {x: W*0.90, y: H*0.38, r: H*0.24},
    {x: W*0.25, y: H*0.18, r: H*0.14},
    {x: W*0.75, y: H*0.18, r: H*0.14},
    {x: W*0.50, y: H*0.09, r: H*0.11},
  ];
  for(var ti = 0; ti < treeSpots.length; ti++){
    var tc   = treeSpots[ti];
    var perT = Math.floor(N * 0.12);
    for(var j = 0; j < perT && idx < N; j++, idx++){
      var a = rnd(0, Math.PI * 2);
      var d = Math.pow(rnd(0, 1), 1.5) * tc.r;
      px[idx] = tc.x + Math.cos(a) * d;
      py[idx] = tc.y + Math.sin(a) * d;
      tx[idx] = px[idx]; ty[idx] = py[idx];
      var c = pickColor(rndInt(1, 4));
      cr[idx]=c.r; cg[idx]=c.g; cb[idx]=c.b;
      sz[idx] = rnd(1.5, 4.5) * dpr; tp[idx]=2; ph[idx]=rnd(0, Math.PI*2); spd[idx]=rnd(0.8,2.0);
    }
  }

  // ── 3. 飘落流光粒子 (余量)
  var fallN = N - idx;
  for(var i = 0; i < fallN && idx < N; i++, idx++){
    px[idx] = rnd(0, W); py[idx] = rnd(-H, H * 0.65);
    tx[idx] = px[idx] + rnd(-W * 0.3, W * 0.3); ty[idx] = H + 100;
    vx[idx] = 0; vy[idx] = rnd(0.6, 2.2) * dpr;
    var c = pickColor(rndInt(0, 5));
    cr[idx]=c.r; cg[idx]=c.g; cb[idx]=c.b;
    sz[idx] = rnd(1, 3.5) * dpr; tp[idx]=5; ph[idx]=rnd(0, Math.PI*2); spd[idx]=rnd(0.7,1.8);
  }

  // 重建空间网格
  buildSpatialGrid();
  for(var i = 0; i < N; i++) insertGrid(i);
}

// ═══════════════════════════════════════════════════════
// BLOOM HELPER (简化版，单层径向)
// ═══════════════════════════════════════════════════════
function bloom(x, y, s, r, g, b, alpha, layers){
  layers = layers || 1;
  for(var l = 0; l < layers; l++){
    var radius = s * (1 + l * 3.5);
    var a      = alpha / (l + 1);
    var gr     = cx.createRadialGradient(x, y, 0, x, y, radius);
    gr.addColorStop(0,   'rgba('+r+','+g+','+b+','+a.toFixed(3)+')');
    gr.addColorStop(1,   'rgba('+r+','+g+','+b+',0)');
    cx.fillStyle = gr;
    cx.beginPath();
    cx.arc(x * dpr, y * dpr, radius * dpr, 0, Math.PI * 2);
    cx.fill();
  }
}

// ═══════════════════════════════════════════════════════
// DRAW — 渲染层
// ═══════════════════════════════════════════════════════
function draw(){
  // ① 半透明背景残影
  cx.globalCompositeOperation = 'source-over';
  var bg = cx.createLinearGradient(0, 0, 0, H * dpr);
  bg.addColorStop(0, '#010612');
  bg.addColorStop(1, '#040920');
  cx.globalAlpha = CFG.BG_ALPHA;
  cx.fillStyle   = bg;
  cx.fillRect(0, 0, W * dpr, H * dpr);
  cx.globalAlpha = 1.0;

  // ② 远景星场（静态，一次性按需绘制由背景残影自然保留）
  // 用 lighter 混合模式叠加远景光晕（稀疏采样省性能）
  cx.save();
  cx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < N; i += CFG.DEPTH_SAMPLE){
    if(tp[i] === 2 || tp[i] === 5){
      var pulse = 1 + Math.sin(t * 2 + ph[i]) * 0.3;
      bloom(px[i], py[i], sz[i] * pulse, cr[i], cg[i], cb[i], CFG.BLOOM_ALPHA, 1);
    }
  }
  cx.restore();

  // ③ 水面填色
  var waterY = H * 0.68;
  cx.fillStyle = 'rgba(8,16,48,0.55)';
  cx.fillRect(0, waterY * dpr, W * dpr, (H - waterY) * dpr);

  // 水面地平线光带
  var horizGrd = cx.createLinearGradient(0, (waterY - 10) * dpr, 0, (waterY + 10) * dpr);
  horizGrd.addColorStop(0, 'rgba(60,130,255,0)');
  horizGrd.addColorStop(0.5,'rgba(60,130,255,0.25)');
  horizGrd.addColorStop(1, 'rgba(60,130,255,0)');
  cx.fillStyle = horizGrd;
  cx.fillRect(0, (waterY - 10) * dpr, W * dpr, 20 * dpr);

  // ④ 粒子核心（lighter 叠加发光）
  cx.save();
  cx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < N; i++){
    var x = px[i] * dpr, y = py[i] * dpr, s = sz[i], type = tp[i];
    var pulse = Math.sin(t * 3 * spd[i] + ph[i]);

    if(type === 5){
      // 飘落流光粒子
      cx.fillStyle = 'rgba('+cr[i]+','+cg[i]+','+cb[i]+',0.75)';
      cx.beginPath();
      cx.arc(x, y, s * (1 + pulse * 0.18), 0, Math.PI * 2);
      cx.fill();
    } else if(type === 2){
      // 树丛发光粒子
      cx.fillStyle = 'rgba('+cr[i]+','+cg[i]+','+cb[i]+',0.55)';
      cx.beginPath();
      cx.arc(x, y, s, 0, Math.PI * 2);
      cx.fill();
    } else {
      // 水面能量粒子
      cx.fillStyle = 'rgba('+cr[i]+','+cg[i]+','+cb[i]+',0.65)';
      cx.beginPath();
      cx.arc(x, y, s * (1 + Math.sin(t * 2 + ph[i]) * 0.2), 0, Math.PI * 2);
      cx.fill();
    }
  }
  cx.restore();

  // ⑤ 暗角
  var vig = cx.createRadialGradient(
    W*dpr/2, H*dpr/2, W*dpr*0.18,
    W*dpr/2, H*dpr/2, W*dpr*0.82
  );
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.72)');
  cx.globalCompositeOperation = 'source-over';
  cx.fillStyle = vig;
  cx.fillRect(0, 0, W * dpr, H * dpr);

  // ⑥ 网格叠加层（可选）
  if(showGrid){
    cx.save();
    cx.globalCompositeOperation = 'source-over';
    cx.strokeStyle = 'rgba(60,140,255,0.06)';
    cx.lineWidth   = 1;
    var gs = 80 * dpr;
    for(var gx = 0; gx < W * dpr; gx += gs){
      cx.beginPath(); cx.moveTo(gx, 0); cx.lineTo(gx, H * dpr); cx.stroke();
    }
    for(var gy = 0; gy < H * dpr; gy += gs){
      cx.beginPath(); cx.moveTo(0, gy); cx.lineTo(W * dpr, gy); cx.stroke();
    }
    cx.restore();
  }

  // ⑦ 鼠标光晕与十字准星
  if(mouse.x > -5000){
    var mx = mouse.x * dpr, my = mouse.y * dpr;
    cx.save();
    cx.globalCompositeOperation = 'lighter';
    bloom(mouse.x, mouse.y, 22 * dpr, 100, 200, 255, 0.28, 2);
    cx.restore();
    cx.save();
    cx.globalCompositeOperation = 'source-over';
    cx.strokeStyle = 'rgba(100,200,255,0.85)';
    cx.lineWidth   = 1.5;
    cx.beginPath(); cx.arc(mx, my, 16 * dpr, 0, Math.PI * 2); cx.stroke();
    cx.beginPath(); cx.moveTo(mx - 22 * dpr, my); cx.lineTo(mx + 22 * dpr, my); cx.stroke();
    cx.beginPath(); cx.moveTo(mx, my - 22 * dpr); cx.lineTo(mx, my + 22 * dpr); cx.stroke();
    cx.restore();
  }
}

// ═══════════════════════════════════════════════════════
// UPDATE — 物理更新层
// ═══════════════════════════════════════════════════════
function update(){
  t += 0.016;

  // 风向缓慢变化
  if(Math.random() < CFG.WIND_CHANGE_INT){
    twA = rnd(-1, 1);
    twS = rnd(0.4, 3.0);
  }
  windA += (twA - windA) * CFG.WIND_LERP;
  windS += (twS - windS) * CFG.WIND_LERP;

  // 重建空间网格（每帧更新，因为粒子在移动）
  buildSpatialGrid();

  for(var i = 0; i < N; i++){
    var type = tp[i];

    if(type === 5){
      // 飘落粒子：重力 + 风向 + 呼吸速度
      vy[i] += 0.012 * spd[i];
      vx[i] += Math.sin(t + ph[i]) * 0.04 * spd[i] + windA * 0.08 * windS;
      px[i] += vx[i];
      py[i] += vy[i];
      if(py[i] > H / dpr + 60){
        py[i] = -60;
        px[i] = rnd(0, W / dpr);
        vy[i] = rnd(0.6, 2.2) * spd[i];
        vx[i] = 0;
      }
    } else if(type === 1){
      // 水面粒子：横向正弦漂移
      px[i] += Math.sin(t * 0.4 * spd[i] + ph[i]) * 0.22;
      py[i] += Math.cos(t * 0.3 + ph[i]) * 0.05;
    } else {
      // 树丛粒子：基准坐标附近微抖动
      px[i] = tx[i] + Math.sin(t * 1.1 * spd[i] + ph[i]) * 3.5;
      py[i] = ty[i] + Math.cos(t * 1.4 * spd[i] + ph[i]) * 3.5;
    }

    vx[i] *= CFG.VEL_DAMPING;
    vy[i] *= CFG.VEL_DAMPING;

    // 鼠标斥力（使用空间网格加速）
    if(mouse.x > -5000){
      var mx = mouse.x, my = mouse.y;
      var dx = px[i] - mx, dy = py[i] - my;
      var d2 = dx * dx + dy * dy;
      var mr = CFG.MOUSE_RADIUS;
      if(d2 < mr * mr && d2 > 0.01){
        var d  = Math.sqrt(d2);
        var f  = (mr - d) * 0.025;
        vx[i] += dx / d * f * spd[i];
        vy[i] += dy / d * f * spd[i];
        px[i] += vx[i];
        py[i] += vy[i];
      }
    }

    insertGrid(i);
  }
}

// ═══════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════
function loop(ts){
  requestAnimationFrame(loop);

  if(paused) return;

  // FPS 计算
  frameCount++;
  fpsAccum += ts - lastTime;
  if(fpsAccum >= 500){
    fps = Math.round(frameCount / (fpsAccum / 1000));
    document.getElementById('fps').textContent     = 'FPS: ' + fps;
    document.getElementById('pcount').textContent  = 'PARTICLES: ' + N;
    frameCount = 0; fpsAccum = 0;
  }
  lastTime = ts;

  draw();
  update();
}

// ═══════════════════════════════════════════════════════
// INPUT HANDLERS
// ═══════════════════════════════════════════════════════
cv.addEventListener('mousemove', function(e){
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
cv.addEventListener('mouseleave', function(){
  mouse.x = -9000;
  mouse.y = -9000;
});
cv.addEventListener('mousedown', function(e){
  // 爆发效果（使用空间网格找附近粒子）
  var bx = e.clientX, by = e.clientY;
  var nearby = queryRadius(bx, by, CFG.MOUSE_BURST_R);
  for(var k = 0; k < nearby.length; k++){
    var i  = nearby[k];
    var dx = px[i] - bx, dy = py[i] - by;
    var d2 = dx * dx + dy * dy;
    var br = CFG.MOUSE_BURST_R;
    if(d2 < br * br && dpr > 0.01){
      var d  = Math.sqrt(d2);
      var f  = (br - d) * 0.12;
      vx[i] += dx / d * f;
      vy[i] += dy / d * f;
    }
  }
});

// 键盘控制
window.addEventListener('keydown', function(e){
  if(e.code === 'Space'){
    paused = !paused;
    e.preventDefault();
  } else if(e.key === '+' || e.key === '='){
    N = Math.min(N + 500, 12000);
    document.getElementById('pcount').textContent = 'PARTICLES: ' + N;
    rebuildScene();
  } else if(e.key === '-' || e.key === '_'){
    N = Math.max(N - 500, 500);
    document.getElementById('pcount').textContent = 'PARTICLES: ' + N;
    rebuildScene();
  } else if(e.key === 'g' || e.key === 'G'){
    showGrid = !showGrid;
  }
});

// 触摸支持
cv.addEventListener('touchmove', function(e){
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
}, {passive: false});
cv.addEventListener('touchend', function(){
  mouse.x = -9000; mouse.y = -9000;
});

// ═══════════════════════════════════════════════════════
// BOOTSTRAP
// ═══════════════════════════════════════════════════════
resize();
loop(0);

})();
</script>
</body>
</html>
