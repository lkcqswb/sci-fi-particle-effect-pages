<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Sakura - Eternal Bloom</title>
    <style>
        body {
            margin: 0;
            background-color: #030003;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 182, 193, 0.6);
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
            text-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="ui-overlay">
        System: Sakura Particle Engine v3.0<br>
        Status: Natural Drift Active<br>
        Particles: ~550,000
    </div>

    <!-- Import Three.js and components via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        const CANOPY_PARTICLES = 450000;
        const PETAL_PARTICLES = 12000;
        const TRUNK_PARTICLES = 100000;
        
        const COLORS = {
            deepPink: new THREE.Color(0xff1493),
            hotPink: new THREE.Color(0xff69b4),
            softPink: new THREE.Color(0xffb6c1),
            white: new THREE.Color(0xfff0f5),
            trunkDark: new THREE.Color(0x2a0a1a)
        };

        // --- Shaders ---
        const particleVertexShader = `
            attribute float size;
            attribute vec3 customColor;
            attribute float opacity;
            attribute float rotation;
            varying vec3 vColor;
            varying float vOpacity;
            varying float vRotation;
            
            void main() {
                vColor = customColor;
                vOpacity = opacity;
                vRotation = rotation;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (400.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const particleFragmentShader = `
            varying vec3 vColor;
            varying float vOpacity;
            varying float vRotation;
            
            void main() {
                vec2 uv = gl_PointCoord - vec2(0.5);
                
                // Rotation for petals
                float s = sin(vRotation);
                float c = cos(vRotation);
                vec2 rotatedUv = vec2(uv.x * c - uv.y * s, uv.x * s + uv.y * c);
                
                // Procedural Petal Shape (teardrop/heart-ish)
                float r = length(rotatedUv);
                float angle = atan(rotatedUv.x, rotatedUv.y);
                
                // Distort distance based on angle to create petal lobes
                float petalShape = r * (1.0 + 0.3 * abs(sin(angle * 1.5)));
                
                if (petalShape > 0.45) discard;
                
                // Softer falloff
                float strength = 1.0 - smoothstep(0.0, 0.45, petalShape);
                strength = pow(strength, 1.5);
                
                gl_FragColor = vec4(vColor, vOpacity * strength);
            }
        `;

        // --- Initialization ---
        let scene, camera, renderer, composer, controls;
        let canopyPoints, petalPoints, trunkPoints;
        const clock = new THREE.Clock();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050005);
            scene.fog = new THREE.FogExp2(0x050005, 0.001);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 300, 700);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.15;
            controls.maxDistance = 1500;
            controls.minDistance = 200;
            controls.target.set(0, 250, 0);

            // --- Post Processing (Refined Bloom) ---
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight), 
                1.2, // Moderate strength, no more lightbulb
                0.4, // radius
                0.2  // higher threshold to see center details
            );
            
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createTree();
            createPetals();

            // Subtle ambient lighting
            const ambientLight = new THREE.AmbientLight(0xff69b4, 0.2);
            scene.add(ambientLight);

            window.addEventListener('resize', onWindowResize);
        }

        function createTree() {
            const tPos = []; const tCol = []; const tSize = []; const tOpac = []; const tRot = [];
            const cPos = []; const cCol = []; const cSize = []; const cOpac = []; const cRot = [];
            const tempColor = new THREE.Color();

            function addParticlesAlongBranch(start, end, startRad, endRad, isTip) {
                const diff = new THREE.Vector3().subVectors(end, start);
                const len = diff.length();
                const iterations = Math.max(10, Math.floor(len * (isTip ? 120 : 60)));
                
                const norm = diff.clone().normalize();
                const pVec = Math.abs(norm.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
                const tangent = new THREE.Vector3().crossVectors(norm, pVec).normalize();
                const bitangent = new THREE.Vector3().crossVectors(norm, tangent).normalize();

                for (let i = 0; i < iterations; i++) {
                    const t = Math.random();
                    const r = Math.sqrt(Math.random()) * (startRad + (endRad - startRad) * t);
                    const angle = Math.random() * Math.PI * 2;
                    
                    const p = new THREE.Vector3()
                        .copy(start)
                        .addScaledVector(diff, t)
                        .addScaledVector(tangent, Math.cos(angle) * r)
                        .addScaledVector(bitangent, Math.sin(angle) * r);

                    tPos.push(p.x, p.y, p.z);

                    const heightFactor = THREE.MathUtils.clamp((p.y + 50) / 450, 0, 1);
                    
                    // Trunk colors: Darker at bottom, transitioning to soft pink tips
                    if (heightFactor < 0.4) {
                        tempColor.copy(COLORS.trunkDark).lerp(COLORS.deepPink, heightFactor / 0.4);
                    } else {
                        tempColor.copy(COLORS.deepPink).lerp(COLORS.softPink, (heightFactor - 0.4) / 0.6);
                    }

                    tCol.push(tempColor.r, tempColor.g, tempColor.b);
                    tSize.push(isTip ? (2.0 + Math.random() * 2) : (3.0 + Math.random() * 5));
                    tOpac.push(0.4 + Math.random() * 0.4);
                    tRot.push(Math.random() * Math.PI * 2);

                    if (isTip || (heightFactor > 0.3 && Math.random() > 0.85)) {
                        const cloudCount = isTip ? 18 : 3;
                        for(let j=0; j<cloudCount; j++) {
                            const offset = new THREE.Vector3(
                                (Math.random() - 0.5) * 60,
                                (Math.random() - 0.5) * 45,
                                (Math.random() - 0.5) * 60
                            );
                            const cp = p.clone().add(offset);
                            cPos.push(cp.x, cp.y, cp.z);
                            
                            const cRand = Math.random();
                            if (cRand > 0.85) tempColor.copy(COLORS.white);
                            else if (cRand > 0.4) tempColor.copy(COLORS.softPink);
                            else tempColor.copy(COLORS.hotPink);

                            cCol.push(tempColor.r, tempColor.g, tempColor.b);
                            cSize.push(2.5 + Math.random() * 7.0);
                            cOpac.push(0.15 + Math.random() * 0.35);
                            cRot.push(Math.random() * Math.PI * 2);
                        }
                    }
                }
            }

            function grow(start, dir, length, radius, depth) {
                const end = new THREE.Vector3().copy(start).addScaledVector(dir, length);
                const isTip = depth <= 1;
                addParticlesAlongBranch(start, end, radius, radius * 0.65, isTip);
                if (depth <= 0) return;
                const branches = depth > 4 ? 1 : (depth > 2 ? 3 : 2); 
                for (let i = 0; i < branches; i++) {
                    const newDir = dir.clone();
                    if (depth > 4) {
                        newDir.x += (Math.random() - 0.5) * 0.15;
                        newDir.z += (Math.random() - 0.5) * 0.15;
                    } else {
                        const spread = (6 - depth) * 0.4;
                        newDir.x += (Math.random() - 0.5) * spread;
                        newDir.y += (Math.random() * 0.25);
                        newDir.z += (Math.random() - 0.5) * spread;
                    }
                    newDir.normalize();
                    grow(end, newDir, length * (0.76 + Math.random() * 0.12), radius * 0.65, depth - 1);
                }
            }

            grow(new THREE.Vector3(0, -60, 0), new THREE.Vector3(0, 1, 0), 180, 28, 6);

            const tGeometry = new THREE.BufferGeometry();
            tGeometry.setAttribute('position', new THREE.Float32BufferAttribute(tPos, 3));
            tGeometry.setAttribute('customColor', new THREE.Float32BufferAttribute(tCol, 3));
            tGeometry.setAttribute('size', new THREE.Float32BufferAttribute(tSize, 1));
            tGeometry.setAttribute('opacity', new THREE.Float32BufferAttribute(tOpac, 1));
            tGeometry.setAttribute('rotation', new THREE.Float32BufferAttribute(tRot, 1));

            trunkPoints = new THREE.Points(tGeometry, new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthTest: true
            }));
            scene.add(trunkPoints);

            const cGeometry = new THREE.BufferGeometry();
            cGeometry.setAttribute('position', new THREE.Float32BufferAttribute(cPos, 3));
            cGeometry.setAttribute('customColor', new THREE.Float32BufferAttribute(cCol, 3));
            cGeometry.setAttribute('size', new THREE.Float32BufferAttribute(cSize, 1));
            cGeometry.setAttribute('opacity', new THREE.Float32BufferAttribute(cOpac, 1));
            cGeometry.setAttribute('rotation', new THREE.Float32BufferAttribute(cRot, 1));

            canopyPoints = new THREE.Points(cGeometry, new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false
            }));
            scene.add(canopyPoints);
        }

        function createPetals() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PETAL_PARTICLES * 3);
            const colors = new Float32Array(PETAL_PARTICLES * 3);
            const sizes = new Float32Array(PETAL_PARTICLES);
            const opacities = new Float32Array(PETAL_PARTICLES);
            const rotations = new Float32Array(PETAL_PARTICLES);
            const velocities = new Float32Array(PETAL_PARTICLES * 3);

            for (let i = 0; i < PETAL_PARTICLES; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 1000;
                positions[i * 3 + 1] = Math.random() * 800;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 1000;

                const rand = Math.random();
                const color = rand > 0.7 ? COLORS.white : (rand > 0.3 ? COLORS.softPink : COLORS.hotPink);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                sizes[i] = 4.0 + Math.random() * 6.0;
                opacities[i] = 0.5 + Math.random() * 0.5;
                rotations[i] = Math.random() * Math.PI * 2;

                velocities[i * 3] = (Math.random() - 0.5) * 1.0; // Wind X
                velocities[i * 3 + 1] = -0.5 - Math.random() * 1.5; // Gravity
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 1.0; // Wind Z
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
            geometry.setAttribute('rotation', new THREE.BufferAttribute(rotations, 1));
            geometry.userData.velocities = velocities;

            petalPoints = new THREE.Points(geometry, new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false
            }));
            scene.add(petalPoints);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            controls.update();

            // Sway tree naturally
            const swayX = Math.sin(elapsed * 0.4) * 5;
            const swayZ = Math.cos(elapsed * 0.3) * 5;
            if (canopyPoints) {
                canopyPoints.position.x = swayX;
                canopyPoints.position.z = swayZ;
                canopyPoints.rotation.y = Math.sin(elapsed * 0.1) * 0.02;
            }
            if (trunkPoints) {
                trunkPoints.position.x = swayX;
                trunkPoints.position.z = swayZ;
                trunkPoints.rotation.y = Math.sin(elapsed * 0.1) * 0.02;
            }

            // Animate Petals with floaty falling motion
            if (petalPoints) {
                const pos = petalPoints.geometry.attributes.position.array;
                const rot = petalPoints.geometry.attributes.rotation.array;
                const vel = petalPoints.geometry.userData.velocities;
                for (let i = 0; i < PETAL_PARTICLES; i++) {
                    const idx = i * 3;
                    
                    // Wind + Gravity
                    pos[idx] += vel[idx] + Math.sin(elapsed * 0.8 + i) * 0.5;
                    pos[idx + 1] += vel[idx + 1];
                    pos[idx + 2] += vel[idx + 2] + Math.cos(elapsed * 0.6 + i) * 0.5;
                    
                    // Tumble rotation
                    rot[i] += 0.02 + Math.random() * 0.03;

                    // Reset if out of bounds
                    if (pos[idx + 1] < -100) {
                        pos[idx] = (Math.random() - 0.5) * 1200;
                        pos[idx + 1] = 800 + Math.random() * 200;
                        pos[idx + 2] = (Math.random() - 0.5) * 1200;
                    }
                }
                petalPoints.geometry.attributes.position.needsUpdate = true;
                petalPoints.geometry.attributes.rotation.needsUpdate = true;
            }

            composer.render();
        }
    </script>
</body>
</html>
