<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Sakura - Eternal Bloom</title>
    <style>
        body {
            margin: 0;
            background-color: #050005;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 105, 180, 0.8);
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="ui-overlay">
        System: Sakura Particle Engine v2.0<br>
        Status: Hyper-Bloom Active<br>
        Particles: ~350,000
    </div>

    <!-- Import Three.js and components via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // --- Configuration ---
        const CANOPY_PARTICLES = 300000;
        const PETAL_PARTICLES = 5000;
        const TRUNK_PARTICLES = 50000;
        
        const COLORS = {
            hotPink: new THREE.Color(0xff1493),
            lightPink: new THREE.Color(0xff69b4),
            gold: new THREE.Color(0xffd700),
            white: new THREE.Color(0xffffff),
            deepRed: new THREE.Color(0x330005)
        };

        // --- Shaders ---
        const particleVertexShader = `
            attribute float size;
            attribute vec3 customColor;
            attribute float opacity;
            varying vec3 vColor;
            varying float vOpacity;
            
            void main() {
                vColor = customColor;
                vOpacity = opacity;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (300.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const particleFragmentShader = `
            varying vec3 vColor;
            varying float vOpacity;
            
            void main() {
                // Circular soft particle
                float dist = distance(gl_PointCoord, vec2(0.5, 0.5));
                if (dist > 0.5) discard;
                
                float strength = 1.0 - (dist * 2.0);
                strength = pow(strength, 2.0);
                
                gl_FragColor = vec4(vColor, vOpacity * strength);
            }
        `;

        // --- Initialization ---
        let scene, camera, renderer, composer, controls;
        let canopyPoints, petalPoints, trunkPoints;
        const clock = new THREE.Clock();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050005);
            scene.fog = new THREE.FogExp2(0x050005, 0.002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 150, 500);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            controls.maxDistance = 1000;
            controls.minDistance = 100;

            // --- Post Processing (Bloom) ---
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight), 
                2.5, // strength
                0.4, // radius
                0.1  // threshold
            );
            
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // --- Create Tree Canopy ---
            createCanopy();
            
            // --- Create Trunk ---
            createTrunk();

            // --- Create Falling Petals ---
            createPetals();

            // --- Bottom Light Source ---
            const bottomLight = new THREE.PointLight(0xffaa00, 10, 800);
            bottomLight.position.set(0, -50, 0);
            scene.add(bottomLight);

            const bottomGlow = new THREE.Mesh(
                new THREE.PlaneGeometry(1000, 1000),
                new THREE.MeshBasicMaterial({ 
                    color: 0x330005, 
                    transparent: true, 
                    opacity: 0.5, 
                    side: THREE.DoubleSide 
                })
            );
            bottomGlow.rotation.x = Math.PI / 2;
            bottomGlow.position.y = -50;
            scene.add(bottomGlow);

            window.addEventListener('resize', onWindowResize);
        }

        function createCanopy() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(CANOPY_PARTICLES * 3);
            const colors = new Float32Array(CANOPY_PARTICLES * 3);
            const sizes = new Float32Array(CANOPY_PARTICLES);
            const opacities = new Float32Array(CANOPY_PARTICLES);

            for (let i = 0; i < CANOPY_PARTICLES; i++) {
                // Distribute particles in a cloud-like structure
                // Main mass
                const r = 150 + Math.random() * 50;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI * 0.7; // Focused on top half

                // Cluster factor
                const clusterX = Math.pow(Math.random(), 2) * (Math.random() > 0.5 ? 1 : -1) * 60;
                const clusterY = Math.pow(Math.random(), 2) * (Math.random() > 0.5 ? 1 : -1) * 40;
                const clusterZ = Math.pow(Math.random(), 2) * (Math.random() > 0.5 ? 1 : -1) * 60;

                const x = r * Math.sin(phi) * Math.cos(theta) + clusterX;
                const y = r * Math.cos(phi) + 150 + clusterY;
                const z = r * Math.sin(phi) * Math.sin(theta) + clusterZ;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // Color mapping: Pink to Gold/White
                let color;
                const rand = Math.random();
                if (rand > 0.95) {
                    color = COLORS.white;
                } else if (rand > 0.8) {
                    color = COLORS.gold;
                } else if (rand > 0.4) {
                    color = COLORS.hotPink;
                } else {
                    color = COLORS.lightPink;
                }

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                sizes[i] = 1.0 + Math.random() * 3.0;
                opacities[i] = 0.2 + Math.random() * 0.8;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 }
                },
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true
            });

            canopyPoints = new THREE.Points(geometry, material);
            scene.add(canopyPoints);
        }

        function createTrunk() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(TRUNK_PARTICLES * 3);
            const colors = new Float32Array(TRUNK_PARTICLES * 3);
            const sizes = new Float32Array(TRUNK_PARTICLES);
            const opacities = new Float32Array(TRUNK_PARTICLES);

            for (let i = 0; i < TRUNK_PARTICLES; i++) {
                const h = Math.random() * 200 - 50;
                const radius = (200 - h) * 0.15 * Math.random();
                const angle = Math.random() * Math.PI * 2;

                positions[i * 3] = Math.cos(angle) * radius;
                positions[i * 3 + 1] = h;
                positions[i * 3 + 2] = Math.sin(angle) * radius;

                colors[i * 3] = 0.2; // Dark Trunk
                colors[i * 3 + 1] = 0.05;
                colors[i * 3 + 2] = 0.1;

                sizes[i] = 1.0 + Math.random() * 2.0;
                opacities[i] = 0.4 + Math.random() * 0.6;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));

            const material = new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                blending: THREE.AdditiveBlending,
                depthTest: true,
                transparent: true
            });

            trunkPoints = new THREE.Points(geometry, material);
            scene.add(trunkPoints);
        }

        function createPetals() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PETAL_PARTICLES * 3);
            const colors = new Float32Array(PETAL_PARTICLES * 3);
            const sizes = new Float32Array(PETAL_PARTICLES);
            const opacities = new Float32Array(PETAL_PARTICLES);
            
            // Custom velocities for petals
            const velocities = new Float32Array(PETAL_PARTICLES * 3);

            for (let i = 0; i < PETAL_PARTICLES; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 600;
                positions[i * 3 + 1] = Math.random() * 400;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 600;

                const color = Math.random() > 0.5 ? COLORS.hotPink : COLORS.gold;
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                sizes[i] = 4.0 + Math.random() * 6.0;
                opacities[i] = 0.6 + Math.random() * 0.4;

                velocities[i * 3] = (Math.random() - 0.5) * 0.5;
                velocities[i * 3 + 1] = -0.5 - Math.random() * 1.0;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
            geometry.userData.velocities = velocities;

            const material = new THREE.ShaderMaterial({
                vertexShader: particleVertexShader,
                fragmentShader: particleFragmentShader,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true
            });

            petalPoints = new THREE.Points(geometry, material);
            scene.add(petalPoints);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            controls.update();

            // Animate Canopy (subtle breathing/wind)
            if (canopyPoints) {
                const positions = canopyPoints.geometry.attributes.position.array;
                for (let i = 0; i < CANOPY_PARTICLES; i++) {
                    const idx = i * 3;
                    // Gentle sway
                    positions[idx] += Math.sin(elapsed * 0.5 + positions[idx+1] * 0.01) * 0.05;
                    positions[idx+2] += Math.cos(elapsed * 0.5 + positions[idx+1] * 0.01) * 0.05;
                }
                canopyPoints.geometry.attributes.position.needsUpdate = true;
            }

            // Animate Petals
            if (petalPoints) {
                const pos = petalPoints.geometry.attributes.position.array;
                const vel = petalPoints.geometry.userData.velocities;
                for (let i = 0; i < PETAL_PARTICLES; i++) {
                    const idx = i * 3;
                    pos[idx] += vel[idx] + Math.sin(elapsed + i) * 0.2;
                    pos[idx+1] += vel[idx+1];
                    pos[idx+2] += vel[idx+2] + Math.cos(elapsed + i) * 0.2;

                    // Reset petals that fall below ground
                    if (pos[idx+1] < -50) {
                        pos[idx] = (Math.random() - 0.5) * 400;
                        pos[idx+1] = 300 + Math.random() * 100;
                        pos[idx+2] = (Math.random() - 0.5) * 400;
                    }
                }
                petalPoints.geometry.attributes.position.needsUpdate = true;
            }

            composer.render();
        }
    </script>
</body>
</html>
