<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Sakura - Umbral Structure</title>
    <style>
        body { margin: 0; background-color: #050005; overflow: hidden; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        .ui-overlay {
            position: absolute; top: 20px; left: 20px; color: rgba(255, 182, 193, 0.8);
            pointer-events: none; text-transform: uppercase; letter-spacing: 2px; font-size: 11px;
            border-left: 2px solid #ff69b4; padding-left: 10px; background: rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="ui-overlay">
        System: Multi-Layer Umbral Engine v6.0<br>
        Mode: Layered Canopy Optimization<br>
        Structure: Bio-Digital Recursive (Umbrella)
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        const COLORS = {
            trunk: new THREE.Color(0x2a0a1a),
            branch: new THREE.Color(0x4a1a35),
            bloom: new THREE.Color(0xff69b4),
            highlight: new THREE.Color(0xffb6c1),
            white: new THREE.Color(0xffffff)
        };

        const vertexShader = `
            attribute float size;
            attribute vec3 customColor;
            attribute float opacity;
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                vColor = customColor;
                vOpacity = opacity;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (300.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard;
                gl_FragColor = vec4(vColor, vOpacity);
            }
        `;

        let scene, camera, renderer, composer, clock, controls;
        let treePoints, petalPoints;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020002);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 4000);
            camera.position.set(0, 400, 1200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 200, 0);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.4;

            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.4, 0.2);
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(bloomPass);

            clock = new THREE.Clock();

            generateTree();
            generateFallingPetals();
            window.addEventListener('resize', onWindowResize);
        }

        function generateTree() {
            const positions = [], colors = [], sizes = [], opacities = [];
            const tempColor = new THREE.Color();

            function createBranch(start, dir, length, radius, depth, type = 'normal') {
                const end = start.clone().add(dir.clone().multiplyScalar(length));
                
                // 1. Draw Branch Particles
                const segmentCount = Math.max(3, Math.floor(length / 5));
                for (let i = 0; i <= segmentCount; i++) {
                    const t = i / segmentCount;
                    const p = start.clone().lerp(end, t);
                    const currentRad = radius * (1 - t * 0.3);
                    
                    p.x += (Math.random() - 0.5) * currentRad * 0.3;
                    p.y += (Math.random() - 0.5) * currentRad * 0.3;
                    p.z += (Math.random() - 0.5) * currentRad * 0.3;

                    positions.push(p.x, p.y, p.z);
                    
                    if (depth > 2) tempColor.copy(COLORS.trunk).lerp(COLORS.branch, (6-depth)/4);
                    else tempColor.copy(COLORS.branch).lerp(COLORS.bloom, (2-depth)/2);
                    
                    colors.push(tempColor.r, tempColor.g, tempColor.b);
                    sizes.push(currentRad * 1.8);
                    opacities.push(depth > 3 ? 0.9 : 0.6);
                }

                // 2. Add Blossom Clusters
                if (depth < 4) {
                    const bloomCount = (5 - depth) * 50;
                    const spread = (5 - depth) * 20;
                    for (let i = 0; i < bloomCount; i++) {
                        const offset = new THREE.Vector3(
                            (Math.random() - 0.5) * spread * 2.5,
                            (Math.random() - 0.5) * spread * 1.2,
                            (Math.random() - 0.5) * spread * 2.5
                        );
                        const bp = end.clone().add(offset);
                        positions.push(bp.x, bp.y, bp.z);
                        
                        const rand = Math.random();
                        if (rand > 0.8) tempColor.copy(COLORS.white);
                        else if (rand > 0.4) tempColor.copy(COLORS.highlight);
                        else tempColor.copy(COLORS.bloom);
                        
                        colors.push(tempColor.r, tempColor.g, tempColor.b);
                        sizes.push(2 + Math.random() * 6);
                        opacities.push(0.15 + Math.random() * 0.25);
                    }
                }

                if (depth <= 0) return;

                // 3. Recursive Branching
                let numBranches = 2;
                let spreadAngle = Math.PI * 0.25;
                let nextLenMult = 0.75;

                if (type === 'bottom') {
                    numBranches = 3;
                    spreadAngle = Math.PI * 0.12; // Keep it horizontal
                    nextLenMult = 0.72;
                } else if (type === 'mid') {
                    numBranches = 2;
                    spreadAngle = Math.PI * 0.18;
                    nextLenMult = 0.7;
                }

                for (let i = 0; i < numBranches; i++) {
                    const newDir = dir.clone();
                    const angleY = (i / numBranches) * Math.PI * 2 + (Math.random() * 0.5);
                    const axis = new THREE.Vector3(Math.cos(angleY), 0, Math.sin(angleY)).normalize();
                    
                    newDir.applyAxisAngle(axis, spreadAngle * (0.8 + Math.random() * 0.4));
                    newDir.normalize();

                    createBranch(end, newDir, length * nextLenMult, radius * 0.65, depth - 1, type);
                }
            }

            // Trunk: Short and thick (only 25% of visual tree height)
            const trunkHeight = 140;
            const trunkRadius = 35;
            for (let i = 0; i < 60; i++) {
                const t = i / 60;
                const p = new THREE.Vector3(0, t * trunkHeight, 0);
                const r = trunkRadius * (1.2 - t * 0.4);
                
                // Add radial volume to trunk
                for(let j=0; j<4; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.pow(Math.random(), 0.5) * r;
                    const px = p.x + Math.cos(angle) * dist;
                    const pz = p.z + Math.sin(angle) * dist;
                    positions.push(px, p.y, p.z);
                    
                    tempColor.copy(COLORS.trunk).lerp(COLORS.branch, t);
                    if (Math.random() > 0.95) tempColor.copy(COLORS.highlight);
                    
                    colors.push(tempColor.r, tempColor.g, tempColor.b);
                    sizes.push(2 + Math.random() * 4);
                    opacities.push(0.8 + Math.random() * 0.2);
                }
            }

            // Layered Branching Strategy
            // Level 1: Bottom Horizontal Layer (Wide Umbrella Base)
            const bottomCount = 12;
            for(let i=0; i<bottomCount; i++) {
                const angleY = (i/bottomCount) * Math.PI * 2;
                const axis = new THREE.Vector3(Math.cos(angleY), 0, Math.sin(angleY)).normalize();
                const dir = new THREE.Vector3(0, 1, 0).applyAxisAngle(axis, Math.PI * 0.48); // 86 degrees (almost horizontal)
                createBranch(new THREE.Vector3(0, trunkHeight * 0.7, 0), dir, trunkHeight * 0.8, 18, 5, 'bottom');
            }

            // Level 2: Middle Layer (Rising structure)
            const midCount = 8;
            for(let i=0; i<midCount; i++) {
                const angleY = (i/midCount) * Math.PI * 2 + 0.4;
                const axis = new THREE.Vector3(Math.cos(angleY), 0, Math.sin(angleY)).normalize();
                const dir = new THREE.Vector3(0, 1, 0).applyAxisAngle(axis, Math.PI * 0.35); // 63 degrees
                createBranch(new THREE.Vector3(0, trunkHeight * 0.9, 0), dir, trunkHeight * 0.8, 14, 4, 'mid');
            }

            // Level 3: Top Layer (Upward crown)
            const topCount = 6;
            for(let i=0; i<topCount; i++) {
                const angleY = (i/topCount) * Math.PI * 2 + 0.8;
                const axis = new THREE.Vector3(Math.cos(angleY), 0, Math.sin(angleY)).normalize();
                const dir = new THREE.Vector3(0, 1, 0).applyAxisAngle(axis, Math.PI * 0.2); // 36 degrees
                createBranch(new THREE.Vector3(0, trunkHeight, 0), dir, trunkHeight * 0.8, 10, 4, 'top');
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            geometry.setAttribute('opacity', new THREE.Float32BufferAttribute(opacities, 1));

            const material = new THREE.ShaderMaterial({
                vertexShader, fragmentShader, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            treePoints = new THREE.Points(geometry, material);
            scene.add(treePoints);
        }

        function generateFallingPetals() {
            const count = 3000;
            const pos = [], col = [], size = [], opac = [], vel = [];
            for (let i = 0; i < count; i++) {
                pos.push((Math.random() - 0.5) * 1500, Math.random() * 1000, (Math.random() - 0.5) * 1500);
                const c = Math.random() > 0.5 ? COLORS.bloom : COLORS.highlight;
                col.push(c.r, c.g, c.b);
                size.push(2 + Math.random() * 3);
                opac.push(0.3 + Math.random() * 0.4);
                vel.push((Math.random() - 0.5) * 1, -0.5 - Math.random() * 1.5, (Math.random() - 0.5) * 1);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('customColor', new THREE.Float32BufferAttribute(col, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(size, 1));
            geo.setAttribute('opacity', new THREE.Float32BufferAttribute(opac, 1));
            geo.userData = { velocities: vel };
            petalPoints = new THREE.Points(geo, new THREE.ShaderMaterial({
                vertexShader, fragmentShader, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            scene.add(petalPoints);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            controls.update();

            if (petalPoints) {
                const positions = petalPoints.geometry.attributes.position.array;
                const v = petalPoints.geometry.userData.velocities;
                for (let i = 0; i < positions.length / 3; i++) {
                    positions[i * 3] += v[i * 3] + Math.sin(elapsed * 0.5 + i) * 0.2;
                    positions[i * 3 + 1] += v[i * 3 + 1];
                    positions[i * 3 + 2] += v[i * 3 + 2] + Math.cos(elapsed * 0.5 + i) * 0.2;
                    if (positions[i * 3 + 1] < 0) positions[i * 3 + 1] = 1000;
                }
                petalPoints.geometry.attributes.position.needsUpdate = true;
            }

            composer.render();
        }
    </script>
</body>
</html>
