<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Fi Pink Sakura Bloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #0a080c; /* 深紫黑色背景，增加深度感 */
    overflow: hidden; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
  }
  canvas { 
    display: block; 
    width: 100vw; 
    height: 100vh; 
    /* 增加对比度和亮度提升辉光感 */
    filter: contrast(1.1) brightness(1.2) saturate(1.2); 
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d', { alpha: false });
  let W, H;

  function resize() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    init();
  }
  
  const branches = [];
  const sakuraParticles = [];
  const fallingPetals = [];
  const bloomPoints = []; // 存储树枝上用于生成樱花的点
  
  const config = {
    maxDepth: 11,
    trunkWidth: 14,
    branchColor: 'rgba(230, 235, 245, 0.45)', // 灰白色树干
    sakuraColors: [
      { r: 255, g: 183, b: 197 }, // 浅粉
      { r: 255, g: 105, b: 180 }, // 深粉 (HotPink)
      { r: 255, g: 192, b: 203 }, // 樱粉
      { r: 255, g: 220, b: 230 }  // 极浅粉
    ],
    sakuraCount: 5000,
    fallingPetalCount: 200,
    lightningJaggedness: 0.5
  };

  class Branch {
    constructor(x1, y1, angle, length, depth, width) {
      this.x1 = x1;
      this.y1 = y1;
      this.angle = angle;
      this.length = length;
      this.depth = depth;
      this.width = width;
      
      this.segments = [];
      let cx = x1;
      let cy = y1;
      const segmentCount = Math.max(3, Math.floor(7 - depth / 2));
      const segLen = length / segmentCount;
      
      for (let i = 0; i < segmentCount; i++) {
        const offset = (Math.random() - 0.5) * config.lightningJaggedness;
        const nextAngle = angle + offset;
        const nx = cx + Math.cos(nextAngle) * segLen;
        const ny = cy + Math.sin(nextAngle) * segLen;
        this.segments.push({ x1: cx, y1: cy, x2: nx, y2: ny });
        cx = nx;
        cy = ny;
        angle += (Math.random() - 0.5) * 0.15;

        // 在中段和末梢记录位置，用于挂载樱花团
        if (depth >= 4 && Math.random() < 0.3) {
           bloomPoints.push({ x: cx, y: cy, depth: depth });
        }
      }
      this.x2 = cx;
      this.y2 = cy;
      
      // 树枝末端必加樱花点
      if (depth >= 5) {
        bloomPoints.push({ x: this.x2, y: this.y2, depth: depth });
      }
    }

    draw() {
      ctx.strokeStyle = config.branchColor;
      ctx.lineWidth = this.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      this.segments.forEach(seg => {
        ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
      });
      ctx.stroke();

      if (this.depth < 3) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = this.width * 0.25;
        ctx.stroke();
      }
    }
  }

  function createTree(x, y, angle, length, depth, width) {
    if (depth > config.maxDepth) return;
    
    const branch = new Branch(x, y, angle, length, depth, width);
    branches.push(branch);

    const numBranches = (depth < 1) ? 2 : (Math.random() < 0.75 ? 2 : 3);
    for (let i = 0; i < numBranches; i++) {
      const angleSpread = 0.5 + (depth / config.maxDepth) * 0.7;
      const newAngle = angle + (Math.random() - 0.5) * angleSpread;
      const newLength = length * (0.7 + Math.random() * 0.2);
      const newWidth = width * 0.62;
      
      if (depth > 6 && Math.random() < 0.1) continue;
      
      createTree(branch.x2, branch.y2, newAngle, newLength, depth + 1, newWidth);
    }
  }

  // 树上的樱花粒子
  class SakuraParticle {
    constructor() {
      this.init();
    }

    init() {
      const bp = bloomPoints[Math.floor(Math.random() * bloomPoints.length)];
      // 樱花在树枝周围形成簇状
      const spread = (bp.depth / config.maxDepth) * 80 + 20;
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.pow(Math.random(), 0.6) * spread;
      
      this.baseX = bp.x + Math.cos(angle) * dist;
      this.baseY = bp.y + Math.sin(angle) * dist;
      this.x = this.baseX;
      this.y = this.baseY;
      
      this.size = Math.random() * 2.2 + 0.4;
      this.alpha = Math.random() * 0.7 + 0.2;
      
      // 随机选择粉色系
      this.color = config.sakuraColors[Math.floor(Math.random() * config.sakuraColors.length)];
      
      this.offset = Math.random() * 100;
    }

    update(t) {
      // 轻微抖动模拟微风
      this.x = this.baseX + Math.sin(t * 0.8 + this.offset) * 3;
      this.y = this.baseY + Math.cos(t * 0.5 + this.offset) * 3;
      this.currentAlpha = this.alpha * (0.7 + Math.sin(t * 1.2 + this.offset) * 0.3);
    }

    draw() {
      const a = this.currentAlpha;
      const { r, g, b } = this.color;
      
      // 核心
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${a})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      
      // 辉光效果
      if (this.size > 1.2) {
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${a * 0.4})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 飘落的花瓣
  class FallingPetal {
    constructor() {
      this.init(true);
    }

    init(randomY = false) {
      this.x = Math.random() * W;
      this.y = randomY ? Math.random() * H : -20;
      this.size = Math.random() * 3 + 2;
      this.speedY = Math.random() * 1 + 0.5;
      this.speedX = (Math.random() - 0.5) * 1.5;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.1;
      this.color = config.sakuraColors[Math.floor(Math.random() * config.sakuraColors.length)];
      this.alpha = Math.random() * 0.6 + 0.3;
      this.swing = Math.random() * 2;
      this.swingSpeed = Math.random() * 0.02 + 0.01;
    }

    update() {
      this.y += this.speedY;
      this.x += this.speedX + Math.sin(this.y * this.swingSpeed) * this.swing;
      this.rotation += this.rotationSpeed;
      
      if (this.y > H + 20) {
        this.init();
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
      
      // 绘制一个简单的花瓣形状（椭圆）
      ctx.beginPath();
      ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // 增加一点点边缘光泽
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
      
      ctx.restore();
    }
  }

  function init() {
    branches.length = 0;
    sakuraParticles.length = 0;
    fallingPetals.length = 0;
    bloomPoints.length = 0;
    
    // 生成树干
    const trunkLen = H * 0.22;
    createTree(W / 2, H * 0.9, -Math.PI / 2, trunkLen, 0, config.trunkWidth);
    
    // 生成树上的樱花
    for (let i = 0; i < config.sakuraCount; i++) {
      sakuraParticles.push(new SakuraParticle());
    }
    
    // 生成落花
    for (let i = 0; i < config.fallingPetalCount; i++) {
      fallingPetals.push(new FallingPetal());
    }
  }

  function drawBottomLight() {
    // 底部向上的暖白光
    const grd = ctx.createRadialGradient(W / 2, H, 0, W / 2, H, H * 0.7);
    grd.addColorStop(0, 'rgba(255, 240, 180, 0.25)'); // 更暖的白光
    grd.addColorStop(0.3, 'rgba(255, 245, 200, 0.1)');
    grd.addColorStop(0.7, 'rgba(255, 180, 200, 0.03)'); // 混合一点粉色余辉
    grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }

  let time = 0;
  function loop() {
    time += 0.015;
    
    // 背景
    ctx.fillStyle = '#0a080c';
    ctx.fillRect(0, 0, W, H);

    drawBottomLight();

    // 绘制树干
    ctx.globalAlpha = 0.9;
    branches.forEach(b => b.draw());
    ctx.globalAlpha = 1.0;

    // 绘制树上的粉色樱花团
    ctx.globalCompositeOperation = 'lighter'; // 使其发光融合
    sakuraParticles.forEach(p => {
      p.update(time);
      p.draw();
    });
    
    // 绘制飘落的花瓣
    ctx.globalCompositeOperation = 'source-over';
    fallingPetals.forEach(p => {
      p.update();
      p.draw();
    });

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  loop();

  // 点击重新生成
  window.addEventListener('mousedown', () => {
    init();
  });
})();
</script>
</body>
</html>
